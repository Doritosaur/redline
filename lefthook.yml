pre-commit:
  commands:
    lint:
      glob: '*.{ts,js,mjs,cjs}'
      run: pnpm exec eslint --max-warnings 0 {staged_files}

pre-push:
  # Sequential: typecheck builds the packages that type-aware lint needs.
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint
    test:
      run: pnpm test
